name: Rename app to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv the-wright-choice-customer-app.html index.html
          git config user.name "TheWrightChoicemts2025"
          git config user.email "johnworkhard94@gmail.com"
          git commit -m "Rename the-wright-choice-customer-app.html to index.html"
          git push
